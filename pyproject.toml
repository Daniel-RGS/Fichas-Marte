[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-autonomous-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.26"]

[project.scripts]
rally = "rally.cli:main"
mars-rover = "mars_rover.cli:main"

[tool.setuptools.packages.find]
include = ["rally*"]

