<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marte: Última Señal · Visor 3D</title>
<style>
html,body{margin:0;overflow:hidden;background:#252c48;color:#f1d6ad;font:14px system-ui,sans-serif}#hud{position:fixed;z-index:2;top:16px;left:16px;padding:15px 18px;border:1px solid #ffffff33;border-radius:14px;background:#171d32dd;box-shadow:0 12px 30px #0006}#hud b{color:#6cc9d7;letter-spacing:.08em}button{margin:10px 5px 0 0;border:0;border-radius:8px;padding:8px 12px;background:#6cc9d7;color:#171d32;font-weight:700;cursor:pointer}#message{color:#d8a8f5;font-weight:700;margin-top:8px}.help{color:#bbb6b0;font-size:12px}
</style></head>
<body><div id="hud"><b>MARTE: ÚLTIMA SEÑAL</b><div id="status">Cargando misión manual…</div><div id="message"></div><button id="manual">Manual</button><button id="replay">Reproducir grabación</button><button id="top">Vista cenital</button><button id="mute">🔊</button><div class="help">W/S avanzar · A/D girar · Espacio saltar · E agarrar · arrastra para cámara · rueda para zoom</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#252c48');scene.fog=new THREE.Fog('#252c48',55,100);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#f1d6ad','#8f382d',2));const sun=new THREE.DirectionalLight('#f1d6ad',2);sun.position.set(-20,35,15);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40,20,20),new THREE.MeshStandardMaterial({color:'#c65e43',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const border=new THREE.Mesh(new THREE.BoxGeometry(40,.5,.5),new THREE.MeshStandardMaterial({color:'#8f382d}));for(const z of [-20,20]){const b=border.clone();b.position.set(0,.25,z);scene.add(b)}for(const x of [-20,20]){const b=border.clone();b.rotation.y=Math.PI/2;b.position.set(x,.25,0);scene.add(b)}
function rock(x,z,r){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(r,0),new THREE.MeshStandardMaterial({color:'#4d3831',flatShading:true}));m.position.set(x,r,z);m.castShadow=true;scene.add(m)}[[8,-7,1.5],[17,-16,1.5],[27,-12,1.25],[34,-18,1],[13,-27,1],[34,-32,1.5]].forEach(v=>rock(...v));
function crater(x,z,r){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.72,.15,24),new THREE.MeshStandardMaterial({color:'#381f25'}));m.position.set(x,.04,z);scene.add(m);const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.18,8,24),new THREE.MeshStandardMaterial({color:'#8f382d'}));ring.rotation.x=Math.PI/2;ring.position.set(x,.12,z);scene.add(ring)}[[7,-24,2.5],[31,-35,2.5],[24,-12,3]].forEach(v=>crater(...v));
const samples=[];function sample(x,z,color,n){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.38),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.55}));m.position.set(x,.45,z);scene.add(m);samples.push({mesh:m,color,n,origin:m.position.clone()})}sample(22,-32,'#6cc9d7',1);sample(18,-5,'#d8a8f5',2);
const base=new THREE.Mesh(new THREE.BoxGeometry(3,.8,3),new THREE.MeshStandardMaterial({color:'#f1d6ad'}));base.position.set(4,.4,-36);base.castShadow=true;scene.add(base);const beacon=new THREE.Mesh(new THREE.TorusGeometry(2.5,.08,8,32),new THREE.MeshBasicMaterial({color:'#6cc9d7'}));beacon.rotation.x=Math.PI/2;beacon.position.set(4,.08,-36);scene.add(beacon);
const rover=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1,.55,.8),new THREE.MeshStandardMaterial({color:'#e9e4d9'}));body.position.y=.75;body.castShadow=true;rover.add(body);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.11),new THREE.MeshBasicMaterial({color:'#6cc9d7'}));lamp.position.set(0,1.1,.42);rover.add(lamp);for(const x of [-.42,.42])for(const z of [-.34,.34]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.12,12),new THREE.MeshStandardMaterial({color:'#252c48'}));w.rotation.z=Math.PI/2;w.position.set(x,.4,z);rover.add(w)}scene.add(rover);
let recording=null,frame=0,playing=true,top=false,muted=false,orbit=0,zoom=8;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.onwheel=e=>{zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.01,4,18)};
function beep(freq=700){if(muted)return;const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);o.stop(a.currentTime+.17)}
function event(e){if(!e)return;const s=samples[e.sample-1];if(e.type==='sample_collected'&&s){s.mesh.visible=false;document.getElementById('message').textContent='Muestra '+e.sample+' recogida · +'+e.reward;beep(e.sample===1?880:660);for(let i=0;i<18;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.045),new THREE.MeshBasicMaterial({color:s.color}));q.position.set(...e.position);q.position.y=.8;scene.add(q);q.userData.life=1;q.userData.v=new THREE.Vector3((Math.random()-.5)*.12,.08+Math.random()*.1,(Math.random()-.5)*.12);q.userData.fx=true}}if(e.type==='victory'){document.getElementById('message').textContent='¡Misión completada!';beep(1100);beacon.material.color.set('#82e6a7')}}
function manual(){const f=keys.w?1:keys.s?-1:0;const t=keys.a?1:keys.d?-1:0;rover.rotation.y+=t*.025;rover.position.x+=Math.sin(rover.rotation.y)*f*.06;rover.position.z+=Math.cos(rover.rotation.y)*f*.06;document.getElementById('status').textContent='Modo manual · batería visual';}
function animate(){requestAnimationFrame(animate);if(playing&&recording){const s=recording.states[frame%recording.states.length];rover.position.set(s.position[0],s.height,s.position[1]-40);rover.rotation.y=-s.heading;const ev=recording.events.filter(e=>e.step===s.step);ev.forEach(event);document.getElementById('status').textContent='Reproducción manual · paso '+s.step+' · batería '+s.battery.toFixed(1)+'%';frame++}else if(!top)manual();if(!top){const behind=new THREE.Vector3(0,4,zoom).applyAxisAngle(new THREE.Vector3(0,1,0),rover.rotation.y);camera.position.lerp(rover.position.clone().add(behind),.1);camera.lookAt(rover.position.clone().add(new THREE.Vector3(0,.5,0)))}else{camera.position.lerp(new THREE.Vector3(0,38,0),.1);camera.lookAt(new THREE.Vector3(0,0,-20))}scene.traverse(o=>{if(o.userData.fx){o.position.add(o.userData.v);o.userData.life-=.025;o.material.opacity=o.userData.life;o.material.transparent=true;if(o.userData.life<=0)o.visible=false}});renderer.render(scene,camera)}
fetch('../artifacts/manual-seed-0.json').then(r=>r.json()).then(d=>{recording=d;document.getElementById('status').textContent='Grabación cargada · '+d.states.length+' pasos';animate()}).catch(()=>{document.getElementById('status').textContent='Modo manual · no se encontró grabación';playing=false;animate()});
document.getElementById('manual').onclick=()=>{playing=false;document.getElementById('message').textContent='Control manual activo'};document.getElementById('replay').onclick=()=>{if(recording){frame=0;playing=true;samples.forEach(s=>{s.mesh.visible=true});document.getElementById('message').textContent=''}};document.getElementById('top').onclick=()=>top=!top;document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'🔇':'🔊'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
